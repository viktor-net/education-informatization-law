ной открытости и информационным системам отрасли.",provisions:[{cite:"ст. 16 ч. 1",text:"«Под электронным обучением понимается организация образовательной деятельности с применением содержащейся в базах данных и используемой при реализации образовательных программ информации и обеспечивающих ее обработку информационных технологий, технических средств, а также информационно-телекоммуникационных сетей, обеспечивающих передачу по линиям связи указанной информации, взаимодействие обучающихся и педагогических работников. Под дистанционными образовательными технологиями понимаются образовательные технологии, реализуемые в основном с применением информационно-телекоммуникационных сетей при опосредованном (на расстоянии) взаимодействии обучающихся и педагогических работников.»"},{cite:"ст. 16 ч. 2",text:"Порядок применения электронного обучения и дистанционных образовательных технологий устанавливается Правительством Российской Федерации, если иное не предусмотрено настоящим Федеральным законом."},{cite:"ст. 18",text:"Печатные и электронные образовательные и информационные ресурсы. Части 8.1–8.3 закрепляют федеральный перечень электронных образовательных ресурсов, включающий в себя электронные образовательные ресурсы, включённые в реестр, и федеральные электронные образовательные ресурсы."},{cite:"ст. 29",text:"Информационная открытость образовательной организации: исчерпывающий перечень сведений, которые организация обязана разместить на своём официальном сайте в сети «Интернет», и требование обеспечить их открытость и доступность."},{cite:"ст. 30",text:"Локальные нормативные акты, регулирующие образовательные отношения. Акты, ухудшающие правовое положение обучающихся, признаются недействительными."},{cite:"ст. 97",text:"Информационная открытость системы образования. Мониторинг в системе образования: источники данных, стандартизированный мониторинг, в том числе аккредитационный."},{cite:"ст. 98",text:"Информационные системы в системе образования: государственные информационные системы, совместимость и взаимодействие информационных систем, защита персональных данных, федеральные и региональные системы, реестры."}],explanation:["Главное, что нужно понять про 273-ФЗ, — принцип: закон не перечисляет конкретные программы и сервисы. Он задаёт рамку и передаёт техническое регулирование Правительству (ст. 16 ч. 2), а обязательное детализированное регулирование — уполномоченным ведомствам и регионам. Поэтому «можно ли нам вести занятие в Zoom / Teams / Moodle» решается не 273-ФЗ, а постановлением Правительства № 1678 и локальным актом образовательной организации.","Второй принцип — распределение обязанностей. Государство задаёт, какая информация обязана быть опубликована (ст. 29, 97) и какие системы обязаны существовать и быть защищены (ст. 98). Конкретное содержание, платформы, кабинеты, ЭОР наполняет сама образовательная организация — но в пределах, установленных законом, и через локальные нормативные акты (ст. 30).","Третий принцип — связка с историей из лекции № 1. Информатизация образования начиналась как «компьютеризация» без правовой рамки; сегодняшний ст. 16 — результат того, что электронное обучение стало нормой, а значит — предметом правового регулирования с обязательствами, лицензированием и ответственностью."],practice:["Решение о применении электронного обучения или ДОТ оформляется локальным нормативным актом организации (при необходимости — с учётом мнения обучающихся).","На официальном сайте организации размещается исчерпывающий набор сведений по ст. 29 — состав этого перечня и есть «минимальная веб-витрина» вуза.","Федеральный перечень ЭОР (ст. 18 ч. 8.1) ограничивает круг ресурсов, которые организация вправе заявлять как федеральные; включение в него — результат экспертизы, а не формальность."]},information:{id:"fz-149",short:"149-ФЗ",title:"Об информации, информационных технологиях и о защите информации",date:"27.07.2006",kind:"law",status:"Общий закон об информации для всех отраслей, включая образование",gist:"Определяет базовые понятия (информация, информационные технологии, информационная система, государственная информационная система), принципы правового регулирования, режим доступа к информации и требования к её защите. По сути — технический словарь, на который ссылается 273-ФЗ в ст. 98.",provisions:[{cite:"ст. 2",text:"«информационные технологии — процессы, методы поиска, сбора, хранения, обработки, предоставления, распространения информации…»; «информационная система — совокупность содержащейся в базах данных информации и обеспечивающих ее обработку информационных технологий и технических средств»; «информационно-телекоммуникационная сеть — технологическая система, предназначенная для передачи по линиям связи информации, доступ к которой осуществляется с использованием средств вычислительной техники»."},{cite:"ст. 3",text:"Принципы правового регулирования в сфере информации: обеспечение открытости и доступности информации, защита информации, недопустимость уничтожения информации, достоверность сведений и ряд других."},{cite:"ст. 9",text:"Порядок обеспечения доступа к информации о деятельности государственных органов и органов местного самоуправления."},{cite:"ст. 10",text:"Государственные информационные системы: состав, правовой статус (федеральные, региональные, муниципальные и иные), требования к созданию и эксплуатации."},{cite:"ст. 16, 19",text:"Защита информации: установление уровней защищённости информации, её правовой режим, условия и порядок допуска к защищаемой информации."},{cite:"ст. 21, 22",text:"Электронная подпись: использование и признание юридической силы документов, подписанных электронной подписью."}],explanation:["149-ФЗ отвечает на вопрос «о чём вообще идёт речь». Для образовательной организации это означает, что её сайт, электронный дневник, LMS, реестр и внутренние базы — это информационные системы, а их функционирование подчиняется общим требованиям к информации и её защите, а не только внутренним регламентам вуза.","Связка статей 149-ФЗ и 273-ФЗ: ст. 98 закона об образовании говорит, какие информационные системы нужны системе образования, а 149-ФЗ — по каким правилам они создаются, эксплуатируются и защищаются. Ни один из двух законов не работает в одиночку.","Отдельный сюжет — электронная подпись. Юридическая сила электронного документа, подписанного УКЭП, позволяет перевести часть административных процедур (договоры, справки, заявления) в электронный вид, но требует, чтобы подпись соответствовала требованиям 63-ФЗ «Об электронной подписи»."],practice:["Публикуя сведения о вузе, организация действует в логике ст. 5 и ст. 9 149-ФЗ: открытость и доступность — правило, закрытость — исключение, которое надо обосновать.","Любая информационная система вуза подпадает под ст. 10 и 16–19: уровень защищённости выбирается осознанно и отражается в документации."]},personalData:{id:"fz-152",short:"152-ФЗ",title:"О персональных данных",date:"27.07.2006",kind:"law",status:"Ключевой закон для любой образовательной информационной системы",gist:"Регулирует обработку персональных данных: принципы и условия обработки, согласие субъекта, специальные категории (данные о состоянии здоровья), трансграничную передачу, обезличивание, меры по обеспечению безопасности и ответственность. Образовательная организация почти всегда выступает оператором персональных данных.",provisions:[{cite:"ст. 5",text:"«Обработка персональных данных должна осуществляться на законной и справедливой основе. Обработка персональных данных должна ограничиваться достижением конкретных, заранее определенных и законных целей… Содержание и объём обрабатываемых персональных данных должны соответствовать заявленным целям обработки… Хранение персональных данных должно осуществляться в форме, позволяющей определить субъекта персональных данных, не дольше, чем этого требуют цели обработки…»"},{cite:"ст. 6",text:"Условия обработки персональных данных: в том числе в целях исполнения договора, стороной которого является субъект, и в целях, непосредственно связанных с предоставлением товаров, выполнением работ или оказанием услуг."},{cite:"ст. 9",text:"Согласие на обработку персональных данных: требования к форме, а в необходимых случаях — к письменной форме."},{cite:"ст. 10",text:"Специальные категории персональных данных, к которым, в частности, относится информация о состоянии здоровья обучающегося."},{cite:"ст. 13, 13.1",text:"Особенности обработки персональных данных в государственных или муниципальных информационных системах; обезличивание персональных данных."},{cite:"ст. 18.1, 19",text:"Меры по обеспечению обязанностей оператора при сборе персональных данных; меры безопасности при их обработке и защита от неправомерного доступа."},{cite:"ст. 24",text:"Ответственность за нарушение требований настоящего Федерального закона."}],explanation:["Связка «образование → персональные данные» неизбежна: в системе вуза обрабатываются ФИО, паспортные и контактные данные, академические и результаты обучения, а для отдельных категорий обучающихся — сведения о здоровье и инвалидности. Каждая новая цифровая система (личный кабинет, LMS, система видеонаблюдения, чат-бот, CRM) автоматически становится операторской точкой и требует правового основания обработки.","Практическое следствие принципа «соответствие объёма данных заявленной цели» (ст. 5): нельзя собирать «на всякий случай». Для каждой новой функции нужно сформулировать цель, определить правовое основание и не захватывать лишние атрибуты.","Обезличивание (ст. 13.1) — легальный способ публиковать статистику и аналитику по студентам, не раскрывая конкретных лиц. Для исследовательской и методической работы это основной рабочий инструмент.","Требования к мерам безопасности (ст. 19) оператор реализует совместно с требованиями Правительства (постановление № 1119) и приказами ФСТЭК России № 17 и ФСБ России № 378 — то есть защищённость образовательной системы определяется не «здравым смыслом», а конкретным нормативным набором."],practice:["Согласие и иные основания обработки фиксируются в Положении об обработке персональных данных, которое является локальным актом вуза.","Данные о здоровье и инвалидности (ст. 10) обрабатываются по особым правилам и не должны попадать в общие витрины, рассылки и учебные аналитические отчёты.","Загружая персональные данные в облачные сервисы и зарубежные системы, нужно отдельно оценить трансграничную передачу (ст. 12) и заключить договор с оператором."]},edo:{id:"pp-1678",short:"ПП РФ № 1678",title:"Об утверждении Правил применения организациями, осуществляющими образовательную деятельность, электронного обучения, дистанционных образовательных технологий при реализации образовательных программ",date:"11.10.2023",kind:"government",status:"Редакция от 06.05.2026. Срок действия ограничен 01.09.2029",gist:"Собственно тот самый подзаконный акт, который ст. 16 ч. 2 273-ФЗ поручает Правительству. Это главный рабочий документ сегодняшнего дня: он определяет, когда образовательная организация вправе применять электронное обучение и ДОТ, какие условия обязательны и какие требования предъявляются к дистанционным занятиям.",provisions:[{cite:"Правила",text:"Условия применения электронного обучения и дистанционных образовательных технологий; перечень условий, при которых дистанционное обучение не допускается или ограничивается; порядок использования платформ и требования к их качеству."}],explanation:["Правила появились как ответ на массовую практику цифрового обучения и на требования к качеству онлайн-образования. Их логика: образовательная организация сама выбирает технологии, но обязана обеспечить уровень результатов, сопоставимый с очным обучением, и обеспечить контроль самостоятельной работы обучающихся.","Правила соединяют два подхода из лекции № 1: с одной стороны, информатизация образования как массовое освоение НИТ; с другой — осторожность: дистанционные технологии не должны подменять собой очное обучение там, где есть прямой педагогический контакт, практикум или клиническая работа.","Часть ограничений дублируется в приказе Минпросвещения № 932, где перечислены профессии и специальности СПО, программы которых нельзя реализовывать исключительно с применением электронного обучения."],practice:["Перед переходом на дистанционный формат организация проверяет: допустим ли он для конкретной программы, закреплён ли в локальном акте, обеспечены ли идентификация обучающегося и контроль результата.","Платформу и её контент следует выбирать так, чтобы они удовлетворяли требованиям к электронным образовательным ресурсам, в том числе к инклюзивности и доступности."]},sdor:{id:"pp-1836",short:"ПП РФ № 1836",title:"О государственной информационной системе «Современная цифровая образовательная среда»",date:"16.11.2020",kind:"government",status:"Инфраструктурный акт; развивает ст. 98 273-ФЗ",gist:"Определяет статус, функции и условия функционирования одноимённой государственной информационной системы — основы цифровой образовательной среды, доступной педагогам, обучающимся и организациям.",explanation:["Это не «программа компьютеризации», а правовой режим конкретной государственной информационной системы. Именно поэтому систему ст. 98 273-ФЗ связывает воедино: 273-ФЗ требует наличия и защищённости информационных систем, а постановление № 1836 создаёт конкретную из них и задаёт правила подключения к ней образовательных организаций.","Практически: участие в СДОС — это не разовая закупка оборудования, а обязанность соблюдать регламент обмена данными и требования к содержанию сведений."]},eor:{id:"pp-1119",short:"ПП РФ № 1119",title:"Об утверждении требований к защите персональных данных при их обработке в информационных системах персональных данных",date:"01.11.2012",kind:"government",status:"Исполнение ст. 19 152-ФЗ",gist:"Конкретизирует требования к защите персональных данных в ИСПДн, в том числе в образовательных: определение уровней защищённости, меры организационной и технической защиты, требования к помещениям, где размещаются информационные системы.",explanation:["Постановление — это «технический слой» 152-ФЗ. Без него требование ст. 19 «обеспечить меры безопасности» остаётся абстракцией; с ним — превращается в перечень организационных мер, требований к сетям и помещениям и правил определения уровня защищённости.","Для вуза это означает, что приказ об ответственном за обработку ПД, модель угроз, категорирование и аттестация информационной системы — не добрая практика, а часть правового режима."]},fsteк:{id:"fstec-17",short:"Приказ ФСТЭК № 17",title:"Об утверждении Требований о защите информации, не составляющей государственную тайну, содержащейся в государственных информационных системах",date:"11.02.2013",kind:"order",status:"Редакция от 28.08.2024",gist:"Устанавливает требования к защите информации в государственных информационных системах, включая требования к защищённости информации, созданию системы безопасности, контролю доступа и защите каналов передачи.",explanation:["Приказ применяется к государственным информационным системам, к которым отнесены, в частности, региональные и федеральные системы в сфере образования. Он задаёт правила проектирования и эксплуатации системы безопасности, а не только меры «на входе»."]},fsb:{id:"fsb-378",short:"Приказ ФСБ № 378",title:"Об утверждении Требований о защите информации, содержащейся в государственных информационных системах, на объектах, отнесённых к категории нормативной защищённости специальной информации",date:"10.07.2014",kind:"order",status:"Отраслевое требование",gist:"Регулирует защиту информации в государственных информационных системах, функционирующих в защищённом контуре, устанавливая дополнительные требования к их защите.",explanation:["В связке с приказом ФСТЭК № 17 образует двухуровневую модель: ФСТЭК задаёт базовые требования, ФСБ — повышенные для систем, обрабатывающих информацию ограниченного доступа."]},services:{id:"fz-210",short:"210-ФЗ",title:"Об организации предоставления государственных и муниципальных услуг",date:"27.07.2010",kind:"law",status:"Регулирует электронное взаимодействие с органами власти и ЕПГУ",gist:"Закладывает принцип электронного взаимодействия при предоставлении государственных и муниципальных услуг, включая возможность подачи заявлений в электронной форме через Единый портал государственных и муниципальных услуг.",explanation:["Для образовательной организации закон важен в двух отношениях. Первое — образовательная организация сама является получателем услуг (приём, лицензирование, аккредитация), и часть процедур переводится в электронную форму. Второе — в связке с 273-ФЗ электронная подача документов и электронная подпись становятся нормой, а не вежливостью."]},signature:{id:"fz-63-sign",short:"63-ФЗ «Об ЭП»",title:"Об электронной подписи",date:"06.04.2011",kind:"law",status:"Определяет виды электронной подписи и порядок её применения",gist:"Разделяет квалифицированную и неквалифицированную электронную подпись, регулирует признание юридической силы документов, подписанных электронной подписью, и требования к удостоверяющим центрам.",explanation:["Ключевой практический вопрос: какая подпись приравнивается к собственноручной. Квалифицированная электронная подпись имеет такую же юридическую силу, как собственноручная; неквалифицированная — в случаях, прямо указанных в законе. Отсюда вывод: студенческие работы, справки, договоры и ведомость успеваемости подписываются тем видом подписи, который признан для соответствующих документов."]},eorList:{id:"fpeor",short:"Приказ Минпросвещения № 591",title:"О федеральном перечне электронных образовательных ресурсов",date:"25.08.2026",kind:"order",status:"Действующий перечень. Ранее — приказ Минпросвещения от 23.07.2025 № 551. Порядок формирования — приказ от 09.01.2025 № 1",gist:"Формирует и утверждает федеральный перечень электронных образовательных ресурсов, во исполнение ст. 18 ч. 8.1–8.3 273-ФЗ. Включение ресурса в перечень — результат экспертизы и юридически значимый факт.",explanation:["Правовая конструкция: ст. 18 273-ФЗ поручает Правительству установить правила включения ресурсов, а ведомство реализует их процедурой экспертизы. Пока ресурс не включён в перечень, его использование в учебном процессе не даёт соответствующих правовых последствий.","Связь с лекцией № 1 заметна прямо: Российский фонд компьютерных учебных программ (РОСФОКОМП) Института информатизации образования выполнял в 1990-е годы ту же функцию — регистрацию программных средств учебного назначения. Сегодня это делает государственный перечень ЭОР."],practice:["Преподаватель при выборе ресурса для курса ориентируется на перечень: это гарантия качества и корректности, а также основание для включения в ФГОС-ориентированную рабочую программу дисциплины."]},professions:{id:"prikaz-932",short:"Приказ Минпросвещения № 932",title:"Об утверждении перечня профессий и специальностей среднего профессионального образования, программы по которым не допускается реализовывать исключительно с применением электронного обучения",date:"13.12.2023",kind:"order",status:"Ограничение круга дистанционного обучения",gist:"Закрепляет прямой запрет на реализацию программ ряда профессий и специальностей СПО исключительно с применением электронного обучения.",explanation:["Приказ — наглядный пример того, как право ограничивает техническую возможность. Квалификация, предполагающая практику, очное освощение манипуляций или работу с людьми, не может быть получена «в сети». Это ровно тот случай, где информатизация упирается в предметные требования ФГОС."]},strategy:{id:"ukaz-203",short:"Указ № 203",title:"О Стратегии развития информационного общества в Российской Федерации на 2017–2030 годы",date:"09.05.2017",kind:"decree",status:"Стратегический документ; действует",gist:"Определяет цели, принципы и приоритеты развития информационного общества, в том числе развитие образования с использованием современных цифровых решений и обеспечение доступности качественного образования.",provisions:[{cite:"п. 25 подп. «и»",text:"«использовать и развивать различные образовательные технологии, в том числе дистанционные, электронное обучение, при реализации образовательных программ»."},{cite:"п. 40 подп. «б»",text:"«создание различных технологических платформ для дистанционного обучения в целях повышения доступности качественных образовательных услуг»."}],explanation:["Стратегия связывает две задачи, которые лекция № 1 формулировала как ценности информационного общества: обеспечение доступности образования и формирование информационной культуры. В правовом плане Стратегия — рамочный документ, дающий мандат на подзаконное регулирование и программное финансирование, но не создающий норм ответственности."]},development:{id:"pp-1642",short:"ПП РФ № 1642",title:"Об утверждении государственной программы Российской Федерации «Развитие образования»",date:"26.12.2017",kind:"government",status:"Редакция от 07.09.2026",gist:"Программный документ, определяющий цели, мероприятия и ресурсы развития образования, в том числе мероприятия по цифровизации образовательной среды и развитию электронных образовательных ресурсов.",explanation:["Программа отвечает на вопрос «кто и за чей счёт это делает». Информатизация образования финансируется не только из бюджета вуза: она является содержанием федеральных программных мероприятий, что объясняет, откуда берутся оснащение, каналы связи и цифровые платформы."]},digital:{id:"pp-234",short:"ПП РФ № 234",title:"О системе управления реализацией национальной программы «Цифровая экономика Российской Федерации»",date:"02.03.2019",kind:"government",status:"Редакция от 01.08.2024",gist:"Определяет порядок управления национальной программой «Цифровая экономика Российской Федерации», в состав которой входит развитие цифровых компетенций и цифровой инфраструктуры, в том числе в образовании.",explanation:["Образовательный трек национальной программы и её связь с 273-ФЗ: цифровая компетенция становится частью образовательных результатов по ФГОС, а инфраструктура — предметом государственной программы. Преподаватель, который хочет правовой статус своим материалам по ИКТ, опирается на эту связку."]},constitution:{id:"constitution",short:"Конституция РФ",title:"Конституция Российской Федерации",date:"12.12.1993",kind:"constitution",status:"С учётом поправок 2020 года",gist:"Закрепляет право на образование, свободу информации и права человека, которые выступают конституционными ограничениями для любой информатизации образовательной среды.",provisions:[{cite:"ст. 2, 24",text:"Человек, его права и свободы являются высшей ценностью. Государство обеспечивает защиту прав и свобод человека, в том числе охрану и поддержку семьи, материнства и детства."},{cite:"ст. 29",text:"Каждый вправе свободно искать, получать, передавать, производить и распространять информацию без ограничения времени, способами и в любой форме, не ограничивая распространение массовой информации, при условии соблюдения прав и свобод других лиц."},{cite:"ст. 33",text:"Каждый имеет право на получение достоверной информации о положении дел, затрагивающих его права и свободы, в том числе на получение информации о деятельности государственных органов и органов местного самоуправления."},{cite:"ст. 43",text:"Каждый имеет право на образование. Государственные образовательные учреждения создаются и финансируются государством."}],explanation:["Конституционные нормы дают образовательной организации две обязанности, которые нередко упускают при внедрении ИКТ. Первая — обеспечивать доступ к достоверной информации об образовании и о самой организации. Вторая — не создавать цифровыми средствами новых ограничений: электронный дневник, личный кабинет и дистанционные формы не должны становиться единственно доступным способом реализации права на образование.","Вторая обязанность — общее ограничение: цифровая среда остаётся частью государственной образовательной услуги, поэтому её организация регулируется публичным правом, а не только внутренними регламентами."]},child:{id:"un-crc",short:"Конвенция ООН о правах ребёнка",title:"Конвенция ООН о правах ребёнка",date:"20.11.1989",kind:"international",status:"Ратифицирована СССР 13.06.1990; действует для РФ",gist:"Международный стандарт, прямо адресованный в том числе доступу ребёнка к информации и к средствам её получения в целях развития способностей, интересов и самостоятельности.",provisions:[{cite:"ст. 17",text:"Государства-участники обязуются поощрять доступ ребёнка к информации и материалам из различных источников, в частности содействовать распространению информации, направленной на улучшение положения детей, в целях развития способностей, интересов, талантов ребёнка, его положительного самосознания и расширения возможностей его получения образования."}],explanation:["Для практики цифрового школьного и вузовского обучения ст. 17 читается двояко. С одной стороны, она обосновывает предоставление обучающимся доступа к образовательным материалам в электронной форме. С другой, она обязывает не ограничивать ребёнка только «одобренными» источниками и развивать его самостоятельность в обращении с информацией — то есть воспитывать информационную грамотность, о которой говорит лекция № 1."]},coe108:{id:"ets-108",short:"Конвенция СЕ ETS № 108",title:"Конвенция Совета Европы о защите физических лиц при их автоматизированной обработке персональных данных",date:"28.01.1981",kind:"international",status:"Ратифицирована Российской Федерацией в 2005 году",gist:"Первый международный документ, заложивший принципы автоматизированной обработки персональных данных; основа национального и европейского регулирования в этой области.",explanation:["Принципы Конвенции (законность, соответствие целей, минимизация данных, точность, срок хранения, защита от неправомерного доступа) воспроизведены в ст. 5 152-ФЗ. Поэтому, читая 152-ФЗ, полезно помнить, что это — национальная реализация международного стандарта, а не изолированная конструкция."]},unesco:{id:"unesco-2000",short:"Рекомендация ЮНЕСКО 2000",title:"Рекомендация об использовании информационно-коммуникационных технологий в системе образования",date:"09.09.2000",kind:"international",status:"Рекомендательный акт ЮНЕСКО",gist:"Программный международный документ о роли ИКТ в образовании: расширение возможностей обучения, совершенствование систем управления, развитие образовательных ресурсов, подготовка педагогических кадров.",explanation:["Рекомендация полезна как объяснение логики: ИКТ рассматриваются не как самоцель, а как средство расширения возможностей обучения, повышения качества и обеспечения универсального доступа. Именно эта логика позже была воспроизведена в Указе № 203 и в программных документах."]},koap:{id:"koap-13",short:"КоАП РФ, ст. 13.11 и др.",title:"Кодекс Российской Федерации об административных правонарушениях",date:"30.12.2001",kind:"code",status:"Административная ответственность операторов и работников",gist:"Устанавливает административную ответственность за нарушения в области персональных данных, защиты информации и законодательства о хранении документов в информационных системах.",provisions:[{cite:"ст. 13.11",text:"Нарушение законодательства Российской Федерации в области персональных данных (обработка в случаях, не предусмотренных законом, либо несовместимая с целями обработки)."},{cite:"ст. 13.12",text:"Нарушение правил защиты информации. Ст. 13.12.1 и 13.12.2 — нарушения требований о защите информации, составляющей коммерческую тайну, и информации ограниченного доступа в значимой части информации ключевых систем."},{cite:"ст. 13.13, 13.14",text:"Незаконная деятельность в области защиты информации; разглашение информации с ограниченным доступом."},{cite:"ст. 13.25, 13.27",text:"Нарушение законодательства о хранении документов и информации в информационных системах; нарушение правил предоставления информации о деятельности государственных органов."}],explanation:["Важно понимать, что субъектом ответственности по 152-ФЗ и 13.11 КоАП обычно является образовательная организация как оператор, а не преподаватель персонально. Практический вывод: политика обработки персональных данных, назначение ответственного и контроль исполнения — это не «бумага для проверки», а инструмент, который защищает вуз и работника."]},uk:{id:"uk-272",short:"УК РФ, ст. 272–274",title:"Уголовный кодекс Российской Федерации",date:"13.06.1996",kind:"code",status:"Уголовная ответственность",gist:"Ответственность за неправомерный доступ к компьютерной информации, за создание и распространение вредоносных программ и за нарушение правил эксплуатации средств обработки информации, передачи и разграничения доступа.",provisions:[{cite:"ст. 272",text:"Неправомерный доступ к компьютерной информации (лица, хранящие информацию, в том числе в информационных системах образовательной организации)."},{cite:"ст. 273, 274",text:"Создание, использование и распространение вредоносных компьютерных программ; нарушение правил эксплуатации средств обработки информации, передачи или разграничения доступа к информации ограниченного доступа."}],explanation:["Отдельная ось регулирования — общежитийные и локальные сети, серверы и учётные записи обучающихся. Права владельца сетевого оборудования и правила разграничения доступа должны быть закреплены, иначе добросовестный пользователь персональных данных вуза оказывается в зоне риска."]}},lu={titleBlock:{university:"ДИТИ НИЯУ МИФИ",universityFull:"Димитровградский инженерно-технологический институт НИЯУ МИФИ",discipline:"Информационное пространство преподавателя инженерного вуза",signatures:[{role:"Выполнил аспирант",name:"Комлев Виктор Владимирович"},{role:"Заведующий кафедрой гуманитарных наук",name:"Игдырова Светлана Викторовна"}]},title:"Правовое регулирование информатизации образования",standfirst:"Краткий конспект по законодательной базе, регламентирующей деятельность образовательных организаций в рамках информатизации образовательной среды: с указанием актов и разъяснения к каждому из них.",abstract:"Информатизация образования прошла путь от «компьютеризации» без правовой рамки к устойчивому правовому режиму, в котором закон устанавливает определения, условия применения, требования к ресурсам и меры ответственности. Настоящий конспект систематизирует законодательную базу этого режима — от конституционных норм и международных актов до постановлений Правительства, ведомственных приказов и кодексов — и разъясняет практическое значение каждого акта для образовательной организации и преподавателя.",keywords:["информатизация образования","электронное обучение","дистанционные образовательные технологии","информационные системы","персональные данные","электронные образовательные ресурсы"],meta:[{label:"Задание",value:"Конспект по лекции № 1: правовое регулирование информатизации образования"},{label:"Предмет",value:"Законодательная база информатизации образовательной среды"},{label:"Юрисдикция",value:"Российская Федерация"},{label:"Составлено",value:"По состоянию на 2026 год"}],sections:[{id:"why",num:1,title:"Постановка задачи: от технической проблемы к правовому режиму",kicker:"Введение",intro:["Лекция № 1 проходит одну мысль последовательно: информатизация образования развивалась как технологический процесс. Сначала — «компьютеризация» и программы для технических специальностей, затем — «массовое освоение новых информационных технологий», и лишь потом — понимание того, что это ещё и общественный институт. Правовое регулирование появилось на третьем шаге.","Отсюда главный вопрос конспекта: чем именно сегодня является информатизация образования в правовом смысле, кто и на каком основании принимает решения о внедрении ИКТ, какие сведения организация обязана раскрывать и за что отвечает."],blocks:[{type:"p",text:"Ключевой признак правового режима — исчезновение функциональной разницы между традиционной образовательной услугой и её цифровой формой. Как только программа может реализовываться дистанционно, а результаты аттестации фиксируются в информационной системе, к ней применяются требования, не зависящие от «бумажного» или «электронного» способа. Именно это и закрепляет 273-ФЗ в статьях 16, 18, 29, 97 и 98."},{type:"note",title:"Три вопроса, на которые отвечает правовое регулирование",items:["Что разрешено — какие технологии и в каком порядке организация вправе применять электронное обучение и дистанционные образовательные технологии.","Что обязательно — какие сведения, ресурсы и системы организация обязана предоставить, а какие акты принять.","Что запрещено — какие действия в области персональных данных и защиты информации влекут ответственность независимо от воли организации."]},{type:"p",text:"Логика конспекта построена по уровням: конституционные и международные нормы → отраслевой закон об образовании → общие законы об информации и персональных данных → подзаконное и ведомственное регулирование → ответственность. Каждый следующий уровень опирается на предыдущий, но не подменяет его."}],acts:[]},{id:"foundations",num:2,title:"Конституционный и международный фундамент",kicker:"Уровень 1",intro:["До отраслевых законов информатизация образования ограничена двумя источниками: конституционными гарантиями и международными стандартами. Они задают рамку, внутри которой допустимы любые технические решения."],blocks:[{type:"p",text:"Правовое значение конституционных норм легко недооценить. Каждое цифровое решение вуза — это, в конечном счёте, решение о том, как реализуется право на образование и право на информацию. Конституция требует, чтобы ни цифровая система, ни электронный документооборот не сужали эти права."},{type:"p",text:"Международные акты выполняют функцию профессиональных стандартов: они не обязательны напрямую, но воспроизводятся в национальном законодательстве. Принципы Конвенции Совета Европы № 108, например, почти дословно вошли в ст. 5 Закона о персональных данных."}],acts:[Al.constitution,Al.child,Al.coe108,Al.unesco]},{id:"law-273",num:3,title:"Базовый закон: 273-ФЗ «Об образовании в Российской Федерации»",kicker:"Уровень 2",intro:["Закон № 273-ФЗ — центральный акт всей конструкции. Именно в нём образовательная организация получила не декларацию о пользе информатизации, а конкретные правовые институты: определения электронного обучения и дистанционных образовательных технологий, режим электронных ресурсов, обязанность информационной открытости и перечень информационных систем.","Ниже приведены статьи, к которым сводится правовое регулирование информатизации образования. Все они находятся в главах 1–2 и 12 закона — то есть в «общих положениях» и в разделе «Управление системой образования. Государственная регламентация образовательной деятельности»."],blocks:[{type:"quote",text:"Под электронным обучением понимается организация образовательной деятельности с применением содержащейся в базах данных и используемой при реализации образовательных программ информации и обеспечивающих ее обработку информационных технологий, технических средств, а также информационно-телекоммуникационных сетей, обеспечивающих передачу по линиям связи указанной информации, взаимодействие обучающихся и педагогических работников. Под дистанционными образовательными технологиями понимаются образовательные технологии, реализуемые в основном с применением информационно-телекоммуникационных сетей при опосредованном (на расстоянии) взаимодействии обучающихся и педагогических работников.",source:"Федеральный закон от 29.12.2012 № 273-ФЗ, ст. 16 ч. 1"},{type:"p",text:"Обратите внимание на разграничение: электронное обучение — это способ организации деятельности (информация, технологии, сети), а дистанционные образовательные технологии — это образовательные технологии, реализуемые преимущественно через сети при опосредованном взаимодействии. Первое — про инфраструктуру и данные, второе — про форму общения и методику. На практике обе категории применяются вместе, но правовая проверка идёт по каждой отдельно."},{type:"table",caption:"Регулирование лицензирования, аккредитации и контроля в 273-ФЗ — без них цифровая среда остаётся неуправляемой",head:["Статья","Предмет","Значение для информатизации"],rows:[["ст. 91","Лицензирование образовательной деятельности","Лицензия действует при неизменности видов деятельности, реализуемых цифровыми средствами"],["ст. 92","Государственная аккредитация","Оценивается в том числе качество подготовки в цифровой среде"],["ст. 93","Государственный контроль (надзор) в сфере образования","Контрольные мероприятия включают проверку информационных систем"],["ст. 93.1","Последствия выявления нарушений обязательных требований","Реестр недобросовестных организаций и ограничения при приёме"]]},{type:"p",text:"Отдельно отметим ст. 13 и ст. 15 закона. Они допускают реализацию образовательных программ самостоятельно и (или) в сетевой форме, включая использование электронного обучения и ДОТ. Это означает, что цифровая среда — не «дополнение» программы, а самостоятельный законный способ её реализации, наравне с очной и заочной."}],acts:[Al.education]},{id:"information-law",num:4,title:"Общие законы об информации и электронной подписи",kicker:"Уровень 3",intro:["Закон об образовании отвечает на вопрос «что образование должно делать в цифровой среде». Законы об информации, государственных услугах и электронной подписи отвечают на вопрос «по каким правилам это делается». Между этими двумя группами норм — самая частая точка рассогласования вузов."],blocks:[{type:"quote",text:"«информационные технологии — процессы, методы поиска, сбора, хранения, обработки, предоставления, распространения информации…»; «информационная система — совокупность содержащейся в базах данных информации и обеспечивающих ее обработку информационных технологий и технических средств»; «информационно-телекоммуникационная сеть — технологическая система, предназначенная для передачи по линиям связи информации, доступ к которой осуществляется с использованием средств вычислительной техники».",source:"Федеральный закон от 27.07.2006 № 149-ФЗ, ст. 2"},{type:"p",text:"Определения из ст. 2 — рабочий инструмент юриста образовательной организации. Когда нужно обосновать, что вуз «создал информационную систему» или «осуществляет передачу информации по сети», ответ берётся отсюда, а не из внутренних регламентов."},{type:"note",title:"Как связаны 149-ФЗ и 273-ФЗ",items:["273-ФЗ, ст. 98 — какие информационные системы нужны системе образования и какие требования к ним предъявляются.","149-ФЗ, ст. 10 — правовой режим государственных информационных систем: статус, требования к созданию и эксплуатации.","149-ФЗ, ст. 16 и 19 — уровни защищённости информации и условия допуска к защищаемой информации.","152-ФЗ и подзаконные акты — конкретные меры защиты персональных данных, которые система обязана обеспечивать."]}],acts:[Al.information,Al.services,Al.signature]},{id:"data-protection",num:5,title:"Персональные данные и информационная безопасность",kicker:"Уровень 4",intro:["Это самый практически значимый раздел конспекта. Практически любая цифровая система в образовательной организации обрабатывает персональные данные, а значит, автоматически становится частью предметной области 152-ФЗ и подпадает под требования ФСТЭК и ФСБ.","Здесь проходит граница, за которой ошибки информатизации перестают быть техническими и становятся правовыми."],blocks:[{type:"quote",text:"«Обработка персональных данных должна осуществляться на законной и справедливой основе. Обработка персональных данных должна ограничиваться достижением конкретных, заранее определенных и законных целей… Содержание и объём обрабатываемых персональных данных должны соответствовать заявленным целям обработки… Хранение персональных данных должно осуществляться в форме, позволяющей определить субъекта персональных данных, не дольше, чем этого требуют цели обработки…»",source:"Федеральный закон от 27.07.2006 № 152-ФЗ, ст. 5"},{type:"p",text:"Принцип «соответствия объёма данных цели» — то, что чаще всего нарушается на практике. Форма заявки на практику собирает адрес, телефон, паспортные данные, сведения о здоровье и согласие на обработку, хотя для допуска к практике достаточно двух полей. Формально каждое поле обосновать можно, но совокупность выходит за пределы заявленной цели — и это уже состав административного правонарушения по ст. 13.11 КоАП РФ."},{type:"ol",items:["Определить, какие персональные данные обрабатывает система и для какой цели.","Выбрать правовое основание обработки: согласие, исполнение договора, законодательное предписание.","Определить уровень защищённости и принять меры по постановлению № 1119 и приказам ФСТЭК № 17 и ФСБ № 378.","Утвердить перечень специальных категорий (ст. 10 152-ФЗ), если они обрабатываются, и изолировать их.","Применить обезличивание (ст. 13.1) для аналитики, публикаций и методических отчётов.","Назначить ответственного и вести учёт: без этого требования ст. 19 не исполняются."]},{type:"p",text:"Отдельно следует держать в голове ст. 12 152-ФЗ: трансграничная передача персональных данных ограничена. Использование зарубежных облачных сервисов, международных видеоконференций и внешних систем хранения требует отдельной оценки и, как правило, дополнительных правовых оснований."}],acts:[Al.personalData,Al.eor,Al.fsteк,Al.fsb]},{id:"edor",num:6,title:"Электронные образовательные ресурсы и федеральный перечень",kicker:"Уровень 5",intro:["Лекция № 1 упоминает Информационно-справочную систему «РОСФОКОМП», которая в 1990-е годы «фактически выполняла функции системы регистрации программных средств учебного назначения». Сегодня эту функцию выполняет федеральный перечень электронных образовательных ресурсов — и это прямое следствие перехода от «компьютеризации» к правовому регулированию."],blocks:[{type:"p",text:"Правовая конструкция состоит из трёх элементов. Статья 18 273-ФЗ (части 8.1–8.3) закрепляет сам перечень и требование включать в него ресурсы, прошедшие экспертизу. Постановление Правительства определяет правила включения. Ведомственные приказы Минпросвещения устанавливают порядок формирования перечня и утверждают его состав."},{type:"p",text:"Практическое значение для преподавателя: включение ресурса в перечень — это юридически значимый факт, который подтверждает и его качество, и его соответствие требованиям. Ресурс, не включённый в перечень, может использоваться в учебном процессе, но не даёт правовых оснований заявлять его как федеральный."},{type:"note",title:"Правовая иерархия в сфере ЭОР",items:["273-ФЗ, ст. 18 ч. 8.1–8.3 — сам перечень как правовой институт.","Приказ Минпросвещения России от 09.01.2025 № 1 — порядок формирования перечня, критерии и процедура экспертизы.","Приказ Минпросвещения России от 25.08.2026 № 591 — действующий состав федерального перечня.","Приказ Минпросвещения России от 23.07.2025 № 551 — предыдущий состав (показывает смену ведомства и периодичность обновления)."]}],acts:[Al.eorList]},{id:"distance",num:7,title:"Дистанционное образование: текущее регулирование",kicker:"Уровень 5",intro:["История дистанционного образования в России прошла путь от инициативы ЮНЕСКО (II Международный конгресс «Образование и информатика», Москва, 1–5 июля 1996 г., где была выдвинута концепция) через постановления и приказы 2000-х годов к сегодняшнему постановлению Правительства № 1678. Путь этот показателен: от концепции и методических рекомендаций — к обязательным правилам с ограничениями."],blocks:[{type:"p",text:"Лекция № 1 фиксирует конкретные вехи: Постановление Правительства РФ № 498 от 23.05.1995, два межведомственных совета при Минобразовании, утверждение Президентом РФ поправок к законам о дистанционной образовательной технологии 10.01.2003, методику организации дистанционного обучения (приказ Минобразования от 18.12.2002 № 4452) и лицензионные нормативы. Сегодня эти документы замещены постановлением № 1678 и ведомственными приказами, но логика — обязанность обеспечить качество и контроль результата — сохранилась."},{type:"p",text:"Обратите внимание на конструкцию ограничения в приказе Минпросвещения № 932. Запрет сформулирован не как «нельзя онлайн вообще», а как «нельзя реализовывать программу исключительно с применением электронного обучения». Это оставляет пространство для смешанного формата и отражает главный принцип: цифровые средства не отменяют требований ФГОС к результатам, объёму практики и формам контроля."},{type:"p",text:"Смежный контур — качество платформ. Информационная система, в которой проходит обучение, должна удовлетворять требованиям к электронным образовательным ресурсам: доступность, инклюзивность, поддержка разных устройств. Практически это означает, что выбор платформы — решение с правовыми последствиями, а не только технической конфигурацией."}],acts:[Al.edo,Al.professions]},{id:"strategy",num:8,title:"Стратегия и государственные программы",kicker:"Уровень 6",intro:["Стратегические и программные документы не создают норм ответственности, но определяют, в каком направлении движется отрасль и кто финансирует движение. Для конспекта они важны потому, что показывают связь правовой нормы с ресурсом: информатизация образования — не «инициатива вуза», а предмет государственной программы."],blocks:[{type:"quote",text:"«использовать и развивать различные образовательные технологии, в том числе дистанционные, электронное обучение, при реализации образовательных программ» (п. 25 подп. «и»); «создание различных технологических платформ для дистанционного обучения в целях повышения доступности качественных образовательных услуг» (п. 40 подп. «б»).",source:"Указ Президента Российской Федерации от 09.05.2017 № 203 «О Стратегии развития информационного общества в Российской Федерации на 2017–2030 годы»"},{type:"p",text:"Программная конструкция выстраивается в три уровня. Национальная программа «Цифровая экономика Российской Федерации» задаёт цифровой вектор и цифровые компетенции. Государственная программа «Развитие образования» переводит их в отраслевые мероприятия по цифровизации образовательной среды. Постановление № 1836 создаёт конкретную государственную информационную систему, через которую эти мероприятия реализуются."},{type:"p",text:"Для преподавателя это означает понятную логику обоснования: цифровая работа поддерживается государственной программой, а её правовая форма — ФГОС, локальные акты и требования к ЭОР. Иными словами, информатизация получает финансовую и нормативную опору, но не освобождает от соблюдения требований закона."}],acts:[Al.strategy,Al.development,Al.digital,Al.sdor]},{id:"liability",num:9,title:"Ответственность за нарушения",kicker:"Уровень 7",intro:["Регулирование было бы неполным без вопроса «что будет, если нарушить». Ответственность в информатизации образования распределена между административной, гражданско-правовой и уголовной, и в каждом блоке есть свои составы правонарушений, связанные именно с цифровой средой."],blocks:[{type:"p",text:"Отдельно подчеркну норму 273-ФЗ: локальные нормативные акты, ухудшающие правовое положение обучающихся, признаются недействительными. Это прямой запрет вводить цифровые правила, которые фактически ограничивают права обучающегося — например, делать электронную регистрацию на курс единственно доступной формой записи."},{type:"p",text:"Субъект административной ответственности по статьям 13.11 и 13.12 КоАП РФ — обычно сама образовательная организация как оператор персональных данных. Уголовная ответственность наступает значительно реже и связана с неправомерным доступом, вредоносным ПО и нарушением правил разграничения доступа. Гражданско-правовая защита включается, когда имущественные интересы или нематериальные блага пострадавшего нарушены."},{type:"table",caption:"Административные составы, к которым приводит цифровая деятельность",head:["Норма","Сфера","Типичная ситуация в образовании"],rows:[["ст. 13.11 КоАП РФ","Персональные данные","Обработка данных, несовместимая с заявленной целью"],["ст. 13.12 КоАП РФ","Защита информации","Нарушение установленных мер защиты"],["ст. 13.12.1, 13.12.2 КоАП РФ","Информация ограниченного доступа","Разглашение сведений из цифровых систем"],["ст. 13.25 КоАП РФ","Хранение документов","Нарушение правил хранения в информационных системах"],["ст. 272 УК РФ","Компьютерная информация","Неправомерный доступ к данным в системе"],["ст. 273, 274 УК РФ","Вредоносное ПО, доступ","Заражение сети, нарушение правил разграничения доступа"]]}],acts:[Al.koap,Al.uk]},{id:"timeline",num:10,title:"Хронология регулирования",kicker:"Справочно",intro:["Ниже — сводная хронология, связывающая этапы информатизации из лекции № 1 с появлением правовых актов. Она показывает характерную закономерность: технологический прорыв опережает правовое регулирование, которое «догоняет» его через несколько лет."],blocks:[{type:"table",caption:"От «компьютеризации» к правовому режиму информатизации образования",head:["Год","Событие в развитии ИТ","Правовой акт"],rows:[["1984–1985","Начало отечественной информатизации образования: решение о поставке персональных ЭВМ и введение курса информатики","—"],["1989–1990","Первая отечественная концепция информатизации образования (А. П. Ершов)","—"],["1993–1998","Программа и Концепция информатизации образования РФ, RUNNet, Интернет-центры","ФЗ РФ «Об образовании» (1992)"],["1996","II Международный конгресс ЮНЕСКО «Образование и информатика» в Москве","Постановление Правительства РФ № 498 от 23.05.1995"],["2001–2005","ФЦП «Развитие единой образовательной информационной среды» (РЕОИС)","ФЗ от 27.07.2006 № 149-ФЗ и № 152-ФЗ"],["2012–2013","Массовое применение ЭО и ДОТ, запуск ЕГЭ, цифровые платформы","273-ФЗ от 29.12.2012; приказ ФСТЭК № 17; ПП № 1119"],["2017","Стратегия развития информационного общества на 2017–2030 годы","Указ Президента РФ № 203"],["2020","Создание государственной информационной системы СДОС","ПП РФ № 1836 от 16.11.2020"],["2023","Новые правила применения электронного обучения и ДОТ; ограничения для отдельных профессий СПО","ПП РФ № 1678; приказ Минпросвещения № 932"],["2025–2026","Обновление федерального перечня ЭОР; цифровая образовательная среда как норма","Приказы Минпросвещения № 1, № 551, № 591"]]}],acts:[]}],practice:[{num:1,title:"Решение об электронном обучении оформляется документом",text:"Переход на электронное обучение или дистанционные образовательные технологии оформляется локальным нормативным актом образовательной организации (ст. 30 273-ФЗ), с учётом мнения обучающихся. Устная договорённость с кафедрой правовой силы не имеет."},{num:2,title:"Проверьте, допустим ли формат для вашей программы",text:"Прежде чем строить курс целиком на дистанционных технологиях, сверьтесь с ПП РФ № 1678 и, для СПО, с приказом Минпросвещения № 932: для ряда профессий исключительно электронное обучение запрещено."},{num:3,title:"Соберите персональные данные под заявленную цель",text:"Проверьте каждую форму: какие поля действительно нужны для цели, какое правовое основание обработки указано, есть ли специальные категории (здоровье, инвалидность). Избыточные поля — самая частая причина претензий по ст. 13.11 КоАП РФ."},{num:4,title:"Опубликуйте всё, что требует ст. 29",text:"Исчерпывающий перечень сведений об образовательной организации на официальном сайте — это минимальная «веб-витрина». Отсутствие части сведений — формальное нарушение, которое обнаруживается при проверке."},{num:5,title:"Опирайтесь на федеральный перечень ЭОР",text:"Для включения ресурса в рабочую программу дисциплины используйте ресурсы из федерального перечня. Это и качественная гарантия, и правовое основание."},{num:6,title:"Не сужайте право на образование цифровыми средствами",text:"Электронный способ не должен быть единственно возможным: очная форма, бумажные заявления и очный доступ к материалам остаются обязательными альтернативами (ст. 30 273-ФЗ, ст. 43 Конституции)."},{num:7,title:"Относитесь к облачным сервисам как к внешнему оператору",text:"Заключайте договор, оценивайте трансграничную передачу (ст. 12 152-ФЗ) и убедитесь, что сервис вправе обрабатывать данные по вашим целям."},{num:8,title:"Закрепляйте права в локальных актах",text:"Правила разграничения доступа к серверам и сетям, порядок хранения материалов и идентификация пользователей — не техническая мелочь, а условие исполнения требований ст. 19 152-ФЗ и ст. 274 УК РФ."}],sources:["Конституция Российской Федерации (с поправками 2020 г.)","Федеральный закон от 29.12.2012 № 273-ФЗ «Об образовании в Российской Федерации»","Федеральный закон от 27.07.2006 № 149-ФЗ «Об информации, информационных технологиях и о защите информации»","Федеральный закон от 27.07.2006 № 152-ФЗ «О персональных данных»","Федеральный закон от 27.07.2010 № 210-ФЗ «Об организации предоставления государственных и муниципальных услуг»","Федеральный закон от 06.04.2011 № 63-ФЗ «Об электронной подписи»","Указ Президента РФ от 09.05.2017 № 203 «О Стратегии развития информационного общества в Российской Федерации на 2017–2030 годы»","Постановление Правительства РФ от 11.10.2023 № 1678 «Об утверждении Правил применения … электронного обучения, дистанционных образовательных технологий …»",'Постановление Правительства РФ от 16.11.2020 № 1836 «О государственной информационной системе "Современная цифровая образовательная среда"»','Постановление Правительства РФ от 26.12.2017 № 1642 «Об утверждении государственной программы Российской Федерации "Развитие образования"»','Постановление Правительства РФ от 02.03.2019 № 234 «О системе управления реализацией национальной программы "Цифровая экономика Российской Федерации"»',"Постановление Правительства РФ от 01.11.2012 № 1119 «Об утверждении требований к защите персональных данных при их обработке в ИСПДн»","Приказ ФСТЭК России от 11.02.2013 № 17; Приказ ФСБ России от 10.07.2014 № 378","Приказ Минпросвещения России от 13.12.2023 № 932; приказы от 09.01.2025 № 1, от 23.07.2025 № 551, от 25.08.2026 № 591","Конвенция ООН о правах ребёнка (1989); Конвенция Совета Европы ETS № 108 (1981); Рекомендация ЮНЕСКО об использовании ИКТ в системе образования (2000)","КоАП РФ (ст. 13.11, 13.12, 13.12.1, 13.12.2, 13.13, 13.14, 13.25, 13.27); УК РФ (ст. 272–274); ГК РФ (ст. 152.1)"],editorial:["Законодательство об образовании изменяется ежегодно, а редакции 273-ФЗ, 149-ФЗ и 152-ФЗ в части информатизации и персональных данных меняются особенно быстро. При использовании конспекта в письменной работе сверяйте номера статей, части и пункты с действующей редакцией на официальном интернет-портале правовой информации (pravo.gov.ru) или в справочных системах.","Номера статей, части и пункты приведены по состоянию на 2026 год. В разъяснениях кавычками воспроизведены формулировки из текстов законов дословно; остальные положения — авторская интерпретация, опирающаяся на смысл и систему норм.","Конспект подготовлен по материалу лекции № 1 и заданию к семинару; он не является юридической консультацией и не заменяет обращения к профильному специалисту по конкретному случаю."]};function hy(_,p){try{const U=window.localStorage.getItem(_);return U===null?p:JSON.parse(U)}catch{return p}}function gy(_,p){const[U,v]=Fl.useState(()=>hy(_,p)),R=Fl.useRef(!0);Fl.useEffect(()=>{if(R.current){R.current=!1;return}try{window.localStorage.setItem(_,JSON.stringify(U))}catch{}},[_,U]);const B=Fl.useCallback(fl=>{v(tl=>tl.includes(fl)?tl.filter(bl=>bl!==fl):[...tl,fl])},[]),nl=Fl.useCallback(fl=>v(fl),[]);return[U,B,nl]}function Sy(_){var R;const[p,U]=Fl.useState((R=_[0])!=null?R:""),v=Fl.useRef(new Map);return Fl.useEffect(()=>{const B=_.map(fl=>document.getElementById(fl)).filter(fl=>fl!==null);if(B.length===0)return;const nl=new IntersectionObserver(fl=>{for(const N of fl)v.current.set(N.target.id,N.isIntersecting?N.intersectionRatio:0);let tl="",bl=0;for(const[N,S]of v.current)S>bl&&(bl=S,tl=N);tl&&U(tl)},{rootMargin:"-15% 0px -70% 0px",threshold:[0,.25,.5,.75,1]});for(const fl of B)nl.observe(fl);return()=>nl.disconnect()},[_]),p}const Ty={constitution:"Конституция",international:"Международный акт",law:"Федеральный закон",decree:"Указ Президента",government:"Постановление Правительства",order:"Приказ / письмо",code:"Кодекс"},by=()=>T.jsx("svg",{viewBox:"0 0 16 16",width:"16",height:"16","aria-hidden":"true",children:T.jsx("path",{d:"M3 6l5 5 5-5",fill:"none",stroke:"currentColor",strokeWidth:"1.5",strokeLinecap:"square"})});function Ey({act:_,index:p,open:U,onToggleOpen:v}){const R=`act-body-${_.id}`;return T.jsxs("article
